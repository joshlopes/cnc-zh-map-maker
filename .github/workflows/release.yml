name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version and create tag
        id: tag
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          # Extract version parts
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Check commit messages for version bump hints
          COMMITS=$(git log "$LATEST"..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          if echo "$COMMITS" | grep -iqE "^(feat|feature)(\(.+\))?!:|BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -iqE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # Generate changelog from commits since last tag
          CHANGELOG=$(git log "$LATEST"..HEAD --pretty=format:"- %s" 2>/dev/null || git log --pretty=format:"- %s")
          # Escape for GH output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  build:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows exe
        run: |
          mkdir -p dist
          docker build -t zh-map-builder .
          docker create --name zh-extract zh-map-builder true
          docker cp zh-extract:/app/dist/ZH-Map-Maker.exe dist/ZH-Map-Maker.exe
          docker rm zh-extract
          ls -lh dist/ZH-Map-Maker.exe

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZH-Map-Maker
          path: dist/ZH-Map-Maker.exe

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZH-Map-Maker
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: |
            ## Changes
            ${{ needs.tag.outputs.changelog }}

            ## Download
            Download `ZH-Map-Maker.exe` below — a standalone Windows app for creating C&C Generals Zero Hour maps.

            ### Quick Start
            1. Download and run `ZH-Map-Maker.exe`
            2. Enter your [Anthropic API key](https://console.anthropic.com/settings/keys) (saved for next time)
            3. Describe your map (e.g. "4-player desert with mountains and oil derricks")
            4. Click **Generate Map** → preview → **Install to Game**

            Works without an API key too (basic offline mode).
          files: dist/ZH-Map-Maker.exe
          draft: false
          prerelease: false
